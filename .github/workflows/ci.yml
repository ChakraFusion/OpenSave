name: CI

# HUNT branch only: repeats the e2e tests that start a CLI daemon on Windows
# with the race detector, to catch the rare "daemon never became ready".

on:
  push:
    branches: ["ci/hunt-daemon-start"]
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes of repetition per job"
        default: "45"

env:
  HUNT_MINUTES: ${{ github.event.inputs.minutes || '35' }}

jobs:
  hunt:
    name: ${{ matrix.kind }} ${{ matrix.arm }} ${{ matrix.rep }}
    runs-on: windows-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        # Round 11: round 10 with fix D extended to the served proof and its
        # test made race-free. Round 10: round 9 plus the lost-report deletion fix. "watch" repeats
        # TestWatchAutoSyncChain (3 failures in round 9) and the deletion
        # tests; shard0/1/2 run the whole suite as upstream splits it now.
        kind: [watch, shard0, shard1, shard2]
        arm: [all]
        rep: [1, 2, 3, 4]
        include:
          - { kind: watch, arm: all, rep: 5 }
          - { kind: watch, arm: all, rep: 6 }
          - { kind: watch, arm: all, rep: 7 }
          - { kind: watch, arm: all, rep: 8 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Stub embedded frontend assets
        shell: bash
        run: mkdir -p cmd/opensave-app/frontend/dist && echo stub > cmd/opensave-app/frontend/dist/.stub
      - name: Arm ${{ matrix.arm }}
        if: matrix.arm == 'nofix'
        shell: bash
        run: |
          cp .github/hunt/db.go.nofix internal/store/db.go
          rm internal/store/migrate_test.go
          git diff --stat
      - name: Repeat ${{ matrix.kind }} (race detector)
        shell: bash
        env:
          LC_ALL: C
        run: |
          case "${{ matrix.kind }}" in shard0) shard=0;; shard1) shard=1;; shard2) shard=2;; *) shard="";; esac
          if [ -n "$shard" ]; then
            # Same selection as upstream ci.yml.
            names=$(grep -ho '^func Test[A-Za-z0-9_]*' e2e/*_test.go | sed 's/^func //' \
              | grep -vx 'TestMain' | sort -u | awk -v n=3 -v i=$shard 'NR % n == i')
            count=1
          elif [ "${{ matrix.kind }}" = watch ]; then
            names=$(grep -ho '^func Test\(WatchAutoSyncChain\|Deletion[A-Za-z0-9_]*\)' e2e/*_test.go | sed 's/^func //' | sort -u)
            count=3
          elif [ "${{ matrix.kind }}" = flaky ]; then
            # Every test that failed in rounds 1-7.
            names="TestMultiRootScenario_ALateReportDoesNotHideADivergence TestSoak_ManyAlternatingRoundsNeverConflict TestIgnored_ASaveFromTheCloudLeavesAnIgnoredFileAlone TestHistory_DeleteSingleSnapshot TestSwitch_TheSameGameUnderDifferentIDsSyncs TestEmptiedFolder_PutBackRestoresThem TestMissingFolder_ARestartDoesNotRecreateItEmpty TestDeletionMultiFile_TheBaseReflectsTheLastDeletionNotTheFirst TestWatchAutoSyncChain TestJourney_SplitSaveThroughItsWholeLife TestFreshRestore_BackupRestoresGamesOntoACleanInstall TestCLI_Storage TestCLI_SnapshotDeleteAndPrune TestCLI_BackupExportImportRoundTrip TestFreshRestore_SnapshotModeReportsWhatItImported"
            count=3
          else
            # Every test that starts a CLI daemon process.
            names=$(awk '/^func Test/{match($0,/Test[A-Za-z0-9_]*/); name=substr($0,RSTART,RLENGTH)} /startDaemon\(\)/ && name!="" {print name}' e2e/*_test.go \
              | grep -vx 'TestMain' | sort -u)
            count=10
          fi
          echo "$(echo "$names" | wc -l | tr -d ' ') tests, -count=$count per iteration, for $HUNT_MINUTES minutes"
          pattern="^($(echo $names | tr ' ' '|'))\$"
          end=$(( $(date +%s) + HUNT_MINUTES * 60 ))
          i=0; status=0
          while [ "$(date +%s)" -lt "$end" ]; do
            i=$((i+1))
            go test ./e2e -race -timeout 55m -count=$count -v -run "$pattern" > "out-$i.txt" 2>&1 || status=1
            echo "iteration $i: $(grep -c '^--- PASS' out-$i.txt) pass, $(grep -c '^--- FAIL' out-$i.txt) fail, $(tail -1 out-$i.txt)"
          done
          cat out-*.txt > all.txt
          echo "== totals over $i iterations =="
          echo "PASS $(grep -c '^--- PASS' all.txt)  FAIL $(grep -c '^--- FAIL' all.txt)  RACE $(grep -c 'WARNING: DATA RACE' all.txt)"
          echo "== per-test pass counts =="
          grep -o '^--- PASS: Test[A-Za-z0-9_]*' all.txt | sort | uniq -c | sort -rn
          echo "== slow daemon starts =="
          grep -h -A30 'HUNT slow daemon start' all.txt | grep -E 'HUNT slow|\[hunt ' || echo none
          echo "== failures (full output) =="
          awk '/^=== RUN   [^\/]*$/{buf=""} {buf=buf $0 "\n"} /^--- FAIL/{print buf; buf=""} /^(panic:|FAIL\t|WARNING: DATA RACE)/{print}' all.txt
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hunt-${{ matrix.kind }}-${{ matrix.arm }}-${{ matrix.rep }}-${{ github.run_attempt }}
          path: all.txt
          if-no-files-found: ignore
